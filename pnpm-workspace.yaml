packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

# Narrow security replacements for transitive versions not yet refreshed upstream.
overrides:
  'dompurify@<3.4.17': 3.4.17
  'fast-uri@<3.1.9': 3.1.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'source-map-js@<1.2.2': 1.2.2
  'happy-dom@<21.0.4': 21.0.4
  'ini@<1.3.6': 1.3.8
  'esbuild@<0.25.0': 0.25.12

# Reviewed security upgrade versions only; keep the general release-age policy intact.
minimumReleaseAgeExclude:
  - '@payloadcms/db-postgres@3.92.1'
  - '@payloadcms/db-sqlite@3.92.1'
  - '@payloadcms/drizzle@3.92.1'
  - '@payloadcms/email-nodemailer@3.92.1'
  - '@payloadcms/graphql@3.92.1'
  - '@payloadcms/next@3.92.1'
  - '@payloadcms/plugin-cloud-storage@3.92.1'
  - '@payloadcms/richtext-lexical@3.92.1'
  - '@payloadcms/storage-s3@3.92.1'
  - '@payloadcms/translations@3.92.1'
  - '@payloadcms/ui@3.92.1'
  - payload@3.92.1

onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
