# Optional named-tunnel ingress example. Set these hostnames to SITE_DOMAIN and API_DOMAIN.
# The token-based Compose profile uses routes configured in Cloudflare instead of this file.

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /etc/cloudflared/<YOUR-TUNNEL-UUID>.json

ingress:
  - hostname: <PUBLIC-PORTFOLIO-HOSTNAME>
    service: http://portfolio:3000
  - hostname: <CMS-AI-HOSTNAME>
    service: http://web:3000
  - service: http_status:404
