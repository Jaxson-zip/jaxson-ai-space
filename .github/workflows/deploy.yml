name: Jaxson AI Space CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-verify:
    name: 🧪 Automated Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Code Quality Gate
        run: pnpm --filter @jaxson/web lint

      - name: Run Vitest Unit Tests
        run: pnpm --filter @jaxson/web test

      - name: Run TypeScript Strict Check
        run: pnpm --filter @jaxson/web typecheck

      - name: Run Next.js Production Build
        run: pnpm --filter @jaxson/web build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ci-build-production-secret-placeholder-32-chars-long
          USE_POSTGRES: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-to-vps:
    name: 🚀 Deploy to Cloud Server (Docker Compose)
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment for Jaxson AI Space..."
            if [ -d "$HOME/jaxson-ai-space" ]; then
              cd "$HOME/jaxson-ai-space"
            elif [ -d "/opt/jaxson-ai-space" ]; then
              cd "/opt/jaxson-ai-space"
            else
              echo "Repository folder not found, please check deployment path."
              exit 1
            fi
            
            git pull origin main
            docker compose -f docker/compose.prod.yaml up -d --build
            echo "✅ Deployment completed successfully!"
