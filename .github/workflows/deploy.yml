name: Jaxson AI Space CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: jaxson-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-verify:
    name: 🧪 Automated Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      rehearsal-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jaxson_rehearsal_ci
          POSTGRES_PASSWORD: synthetic-rehearsal-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jaxson_rehearsal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high and critical production dependency advisories
        run: pnpm audit --prod --audit-level=high

      - name: Run ESLint Code Quality Gate
        run: pnpm --filter @jaxson/web lint

      - name: Run Vitest Unit Tests
        run: pnpm --filter @jaxson/web test

      - name: Run TypeScript Strict Check
        run: pnpm --filter @jaxson/web typecheck

      - name: Rehearse PostgreSQL migration upgrade, rollback and reapply
        run: pnpm --filter @jaxson/web exec tsx scripts/rehearse-database.mts prepare
        env:
          RELEASE_REHEARSAL: "true"
          REHEARSAL_DATABASE_URI: postgresql://postgres:synthetic-rehearsal-only@127.0.0.1:55432/jaxson_rehearsal_ci
          REHEARSAL_MEDIA_DIR: ${{ github.workspace }}/scratch/rehearsal-media

      - name: Run Next.js Production Build
        run: pnpm --filter @jaxson/web build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ci-build-production-secret-placeholder-32-chars-long
          USE_POSTGRES: "false"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Public Portfolio
        run: pnpm --filter @jaxson/portfolio build
        env:
          PORTFOLIO_API_ORIGIN: https://api.example.com

      - name: Setup Python operations dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install operations and public-delivery test dependencies
        run: python -m pip install -r docker/requirements.test.txt

      - name: Test Public Portfolio
        run: pnpm --filter @jaxson/portfolio test

      - name: Install Chromium for portfolio reflow checks
        run: pnpm --filter @jaxson/web exec playwright install --with-deps chromium

      - name: Test portfolio paging and zoom reflow in Chromium
        run: pnpm --filter @jaxson/web exec playwright test --config playwright.portfolio.config.ts

      - name: Seed isolated public-page test database
        run: pnpm --filter @jaxson/web seed:public-test
        env:
          PUBLIC_TEST_FIXTURE: "true"
          SQLITE_DATABASE_FILE: ./payload-public-tests.db
          MEDIA_DIR: ${{ github.workspace }}/scratch/public-test-media
          USE_POSTGRES: "false"

      - name: Test full-screen chat, public pages and media access
        run: pnpm --filter @jaxson/web exec playwright test --config playwright.web.config.ts
        env:
          PUBLIC_TEST_FIXTURE: "true"
          SQLITE_DATABASE_FILE: ./payload-public-tests.db
          MEDIA_DIR: ${{ github.workspace }}/scratch/public-test-media
          USE_POSTGRES: "false"

      - name: Verify production images against isolated PostgreSQL
        env:
          PAYLOAD_SECRET: ci-rehearsal-only-secret-never-used-in-production-20261028
          DATABASE_URI: postgresql://owner_app:synthetic-rehearsal-owner@127.0.0.1:55432/jaxson_rehearsal_ci
          PUBLIC_AGENT_DATABASE_URI: postgresql://public_agent:synthetic-rehearsal-reader@127.0.0.1:55432/jaxson_rehearsal_ci
          WEB_TEST_URL: http://localhost:3110
          TEST_PORTFOLIO_URL: http://localhost:4180
          HANDOFF_HOME_URL: http://localhost:4180
          PUBLIC_TEST_FIXTURE: "true"
        run: |
          set -eu
          docker build -f docker/Dockerfile.web --build-arg NEXT_PUBLIC_PORTFOLIO_URL=http://localhost:4180 --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3110 -t jaxson-web:ci-rehearsal .
          docker build -f docker/Dockerfile.portfolio --build-arg PORTFOLIO_API_ORIGIN=http://localhost:3110 -t jaxson-portfolio:ci-rehearsal .
          trap 'docker rm -f jaxson-ci-web jaxson-ci-portfolio >/dev/null 2>&1 || true' EXIT
          docker run -d --name jaxson-ci-web --network host -v "$PWD/scratch/rehearsal-media:/app/media:ro" -e MEDIA_DIR=/app/media -e PORT=3110 -e USE_POSTGRES=true -e PAYLOAD_SECRET -e DATABASE_URI -e PUBLIC_AGENT_DATABASE_URI -e CLOUDFLARE_ACCESS_REQUIRED=true jaxson-web:ci-rehearsal
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3110/api/showcase-projects >/dev/null && break; sleep 2; done
          docker exec -e PUBLIC_HEALTH_ORIGIN=http://127.0.0.1:3110 jaxson-ci-web node apps/web/scripts/check-public-health.mjs
          docker exec jaxson-ci-web node apps/web/scripts/run-index-worker.mjs --health
          docker run -d --name jaxson-ci-portfolio --network host --read-only -e PORT=4180 -e PORTFOLIO_UPSTREAM_ORIGIN=http://127.0.0.1:3110 jaxson-portfolio:ci-rehearsal
          for attempt in $(seq 1 15); do curl -fsS http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4180/api/showcase-projects >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/projects/private-fixture)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/api/users)" = 404
          pnpm --filter @jaxson/web exec playwright test --config playwright.web.config.ts
        # This flag selects upload assertions in the browser runner only; the running
        # production image keeps its normal .next output directory.

      - name: Validate Production Compose Template
        run: |
          docker compose --env-file docker/.env.example -f docker/compose.prod.yaml --profile bootstrap --profile tunnel --profile maintenance config --quiet
          docker compose -f docker/compose.vps-existing.yaml config --no-env-resolution --quiet
          docker compose -f docker/compose.rehearsal.yaml --profile runtime config --quiet
          sh -n docker/backup.sh
          sh -n docker/restore.sh
          sh -n docker/lib/compose.sh
          node --check apps/web/scripts/cms-content.mjs
          node --check apps/web/scripts/reindex-knowledge.mjs
          node --check apps/web/scripts/check-smtp.mjs
          sh -n docker/backup-vps-existing.sh
          sh -n docker/restore-vps-existing.sh
          sh -n docker/deploy-vps-existing.sh
          sh -n docker/notify-vps-failure.sh
          node --test docker/tests/notify-vps-failure.test.mjs
          node --test integrations/openclaw/weixin-admission.test.mjs integrations/openclaw/weixin-context.test.mjs
          node --test integrations/openclaw/weixin-inbox.test.mjs integrations/openclaw/weixin-inbox-path.test.mjs
          node --test integrations/openclaw/jaxson-inbox/*.test.mjs
          sh -n integrations/openclaw/prepare-vps.sh
          sh -n docker/lib/release.sh
          python3 -m unittest discover -s docker/tests -v

      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            scratch/playwright-portfolio
            scratch/playwright-web
          if-no-files-found: ignore
          retention-days: 7

  deploy-to-vps:
    name: Deploy verified images to the existing VPS
    needs: test-and-verify
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - uses: actions/checkout@v4
      - name: Build immutable application images
        env:
          PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL || 'https://jaxson.bond' }}
          API_URL: ${{ vars.API_URL || 'https://api.jaxson.bond' }}
        run: |
          set -eu
          docker build -f docker/Dockerfile.web --build-arg NEXT_PUBLIC_PORTFOLIO_URL="$PORTFOLIO_URL" --build-arg NEXT_PUBLIC_SERVER_URL="$API_URL" -t "jaxson-web:$GITHUB_SHA" .
          docker build -f docker/Dockerfile.portfolio --build-arg PORTFOLIO_API_ORIGIN="$API_URL" -t "jaxson-portfolio:$GITHUB_SHA" .
          mkdir -p release-artifact/tools/lib release-artifact/migrations
          docker save "jaxson-web:$GITHUB_SHA" "jaxson-portfolio:$GITHUB_SHA" -o release-artifact/images.tar
          WEB_IMAGE=$(docker image inspect --format '{{.Id}}' "jaxson-web:$GITHUB_SHA")
          PORTFOLIO_IMAGE=$(docker image inspect --format '{{.Id}}' "jaxson-portfolio:$GITHUB_SHA")
          export WEB_IMAGE PORTFOLIO_IMAGE
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          migrations = re.findall(r"name: '([0-9]{8}_[0-9]{6}_[a-z0-9_]+)'", Path('apps/web/src/migrations/index.ts').read_text())
          data = dict(version=1, release_id=os.environ['GITHUB_SHA'], web_image=os.environ['WEB_IMAGE'], portfolio_image=os.environ['PORTFOLIO_IMAGE'], migrations=migrations)
          Path('release-artifact/artifact.json').write_text(json.dumps(data) + '\n')
          PY
          cp docker/backup-vps-existing.sh docker/restore-vps-existing.sh docker/deploy-vps-existing.sh release-artifact/tools/
          cp docker/notify-vps-failure.sh docker/notify-vps-failure.mjs release-artifact/tools/
          cp docker/lib/release.sh docker/lib/release_snapshot.py docker/lib/release_candidate.py docker/lib/release_images.py docker/lib/release_retention.py release-artifact/tools/lib/
          cp apps/web/scripts/check-public-health.mjs release-artifact/tools/lib/
          cp docker/migrations/003-security-update.sql release-artifact/migrations/
          (cd release-artifact/migrations && sha256sum 003-security-update.sql > SHA256SUMS)
          (cd release-artifact && sha256sum images.tar artifact.json > SHA256SUMS)
          python3 docker/lib/release_snapshot.py artifact release-artifact
      - name: Retain the verified deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release-artifact
          retention-days: 14
      - name: Upload and deploy with pinned SSH host trust
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_HOST" && test -n "$VPS_USERNAME" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS" || { echo 'Configure the VPS SSH secrets and pinned known_hosts before deployment'; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] && [[ "$VPS_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]] && [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          private=$(mktemp -d)
          trap 'rm -rf -- "$private"' EXIT
          chmod 700 "$private"
          printf '%s\n' "$VPS_SSH_KEY" > "$private/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$private/known_hosts"
          chmod 600 "$private/key" "$private/known_hosts"
          remote="/opt/jaxson-releases/artifacts/$GITHUB_SHA"
          ssh_args=(-C -i "$private/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private/known_hosts" -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -o ConnectTimeout=30)
          ssh "${ssh_args[@]}" -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "umask 077; mkdir -p '$remote'; chmod 700 '$remote'"
          scp "${ssh_args[@]}" -P "$VPS_PORT" -r release-artifact/. "$VPS_USERNAME@$VPS_HOST:$remote/"
          ssh "${ssh_args[@]}" -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "sh '$remote/tools/deploy-vps-existing.sh' '$remote' --verify"
          ssh "${ssh_args[@]}" -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "sh '$remote/tools/deploy-vps-existing.sh' '$remote' --apply"
