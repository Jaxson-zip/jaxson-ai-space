name: Verify existing production release

on:
  workflow_dispatch:
    inputs:
      client_ip:
        description: Optional owner IP for SSH blocking diagnostics
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jaxson-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate owner operations checks
        run: |
          python3 -m py_compile docker/verify-vps-existing.py
          python3 -m pip install -r docker/requirements.pc-ops.txt --quiet
          python3 -m unittest docker.tests.test_windows_network docker.tests.test_pc_monitor docker.tests.test_owner_backup_transfer docker.tests.test_release_postflight docker.tests.test_private_backup -v
          python3 -m unittest docker.tests.test_deploy_preflight docker.tests.test_release_ops docker.tests.test_backup_resume docker.tests.test_release_rollback docker.tests.test_release_candidate docker.tests.test_release_images docker.tests.test_shizhang_publish -v
          node --test docker/tests/test_shizhang_content.mjs
      - name: Inspect existing release without deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          CLIENT_IP: ${{ inputs.client_ip }}
        run: |
          set -eu
          test -n "$VPS_HOST" && test -n "$VPS_USERNAME" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] && [[ "$VPS_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]] && [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          private=$(mktemp -d)
          trap 'rm -rf -- "$private"' EXIT
          chmod 700 "$private"
          printf '%s\n' "$VPS_SSH_KEY" > "$private/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$private/known_hosts"
          chmod 600 "$private/key" "$private/known_hosts"
          [[ -z "$CLIENT_IP" || "$CLIENT_IP" =~ ^[0-9a-fA-F.:]+$ ]]
          ssh -i "$private/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private/known_hosts" -o ServerAliveInterval=20 -o ConnectTimeout=30 -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "python3 - '$CLIENT_IP'" < docker/verify-vps-existing.py
