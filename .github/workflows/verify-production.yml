name: Verify existing production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaxson-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check verifier syntax
        run: |
          python3 -m py_compile docker/verify-vps-existing.py
          python3 -m unittest discover -s docker/tests -p test_release_postflight.py -v
      - name: Inspect existing release without deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_HOST" && test -n "$VPS_USERNAME" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] && [[ "$VPS_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]] && [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          private=$(mktemp -d)
          trap 'rm -rf -- "$private"' EXIT
          chmod 700 "$private"
          printf '%s\n' "$VPS_SSH_KEY" > "$private/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$private/known_hosts"
          chmod 600 "$private/key" "$private/known_hosts"
          ssh -i "$private/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private/known_hosts" -o ServerAliveInterval=20 -o ConnectTimeout=30 -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" 'python3 -' < docker/verify-vps-existing.py
