  <rect x="290" y="70" width="220" height="340" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="310" y="102" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">02 / CORE SERVICES &amp; CMS</text>
  <text x="310" y="128" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Payload CMS 3.x Headless</text>
  <text x="310" y="148" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Embedded GraphQL &amp; REST API</text>

  <rect x="306" y="170" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="320" y="192" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Credentials &amp; Projects</text>
  <text x="320" y="210" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">动态履历 · 竞赛成果 · 项目归档</text>

  <rect x="306" y="235" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="320" y="257" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">RAG Prompt 组装器</text>
  <text x="320" y="275" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Prompt Builder · 严格防幻觉</text>

  <rect x="306" y="300" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="320" y="322" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">S3 / R2 媒体对象存储</text>
  <text x="320" y="340" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">静态资源与凭据附件云托管</text>

  <!-- Right Column: Database & Infrastructure -->
  <rect x="544" y="70" width="220" height="340" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="564" y="102" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">03 / STORAGE &amp; INFRA</text>
  <text x="564" y="128" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">PostgreSQL 17 + pgvector</text>
  <text x="564" y="148" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Dual Schema 物理隔离安全机制</text>

  <rect x="560" y="170" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="574" y="192" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Vector Embeddings (HNSW)</text>
  <text x="574" y="210" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">余弦距离检索 · 毫秒级匹配</text>

  <rect x="560" y="235" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="574" y="257" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Docker + PM2 进程守护</text>
  <text x="574" y="275" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">自动化构建 · 零中断平滑重载</text>

  <rect x="560" y="300" width="188" height="50" rx="6" fill="#27272a" fill-opacity="0.5" stroke="#3f3f46" stroke-width="1" />
  <text x="574" y="322" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Cloudflare Tunnel 隧道</text>
  <text x="574" y="340" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">边缘加速 · 全站端到端 HTTPS</text>

  <!-- Connectors -->
  <line x1="256" y1="240" x2="290" y2="240" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="510" y1="240" x2="544" y2="240" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
