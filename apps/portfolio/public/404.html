<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>页面未找到 · 张锦鹏 Jaxson</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-display: swap; src: url('/fonts/plus-jakarta-sans-700.704be0308e53.woff2') format('woff2'); }
    @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-display: swap; src: url('/fonts/plus-jakarta-sans-800.ca987f604ad6.woff2') format('woff2'); }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 16px; background: #F3F4F7; color: #0E1526;
      font: 400 16px/1.7 'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif; }
    main { width: min(100%, 560px); padding: clamp(28px, 6vw, 48px); display: grid; gap: 16px; background: #fff; border: 1px solid #E2E5EC; border-radius: 16px;
      box-shadow: 0 1px 2px rgba(14,21,38,.04), 0 10px 30px -14px rgba(14,21,38,.12); }
    .badge { width: fit-content; padding: 6px 10px; border-radius: 999px; background: #E6ECFF; color: #2952E3; font-size: 14px; font-weight: 700; }
    h1 { font-size: clamp(30px, 5vw, 40px); line-height: 1.2; font-weight: 800; }
    p { color: #4B5468; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #E2E5EC; color: #0E1526; font-weight: 700; text-decoration: none; }
    a.primary { background: #2952E3; border-color: #2952E3; color: #fff; }
    a:focus-visible { outline: 2px solid #2952E3; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="badge">404</p>

    <div class="actions">
      <a class="primary" href="/">回到首页</a>
      <a href="/#ask">问我的 AI</a>
    </div>
  </main>
</body>
</html>
